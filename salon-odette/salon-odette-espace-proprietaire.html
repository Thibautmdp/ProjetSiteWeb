<!--
  Espace propriétaire — Salon Odette. Page interne réservée au(x) compte(s) marqué(s)
  `staff.is_owner = true` (aujourd'hui : Odette, réglé à la main dans Supabase, voir
  salon-odette-schema.sql), séparée du site public ET de salon-odette-espace-coiffeur.html.

  Un propriétaire est aussi un coiffeur normal : SON PROPRE planning/absences/stats perso
  restent sur salon-odette-espace-coiffeur.html (identique à ce que voit Karim/Lina), avec
  juste un lien "→ Espace propriétaire" qui mène ici. Cette page-ci ne montre RIEN de
  personnel — seulement ce qui dépasse un seul coiffeur : statistiques du salon entier ou
  par coiffeur, tous les clients du salon, et le planning de n'importe quel coiffeur.

  Née le 2026-09-04 d'une première version qui mettait tout ça en bas du tableau de bord
  personnel (sous forme d'onglets) — séparée en page à part car ça noyait le planning
  perso sous les infos de gestion du salon, peu pratique pour un usage quotidien.

  Connexion Supabase distincte (mêmes comptes que le reste du site, mais un compte doit
  être ET dans `staff` ET avec `is_owner = true` pour accéder au tableau de bord — un
  coiffeur normal qui se trompe de page est renvoyé vers l'espace coiffoir habituel).
-->
<title>Espace propriétaire — Salon Odette</title>
<style>
  :root {
    --ivoire: #F2EAE1;
    --ivoire-surface: #E9DFD3;
    --encre: #1B1512;
    --encre-soft: #5B5049;
    --bordeaux: #6C2437;
    --bordeaux-contrast: #F2EAE1;
    --laiton: #A9814D;
    --laiton-contrast: #1B1512;
    --border: rgba(27,21,18,0.14);
    --shadow: 0 1px 2px rgba(27,21,18,0.06), 0 10px 28px rgba(27,21,18,0.08);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ivoire: #17120F; --ivoire-surface: #211A16; --encre: #F2EAE1; --encre-soft: #B9AEA5;
      --bordeaux: #C06A80; --bordeaux-contrast: #1B1512; --laiton: #D8B37E; --laiton-contrast: #1B1512;
      --border: rgba(242,234,225,0.14); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ivoire: #17120F; --ivoire-surface: #211A16; --encre: #F2EAE1; --encre-soft: #B9AEA5;
    --bordeaux: #C06A80; --bordeaux-contrast: #1B1512; --laiton: #D8B37E; --laiton-contrast: #1B1512;
    --border: rgba(242,234,225,0.14); color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--ivoire); color: var(--encre);
    font-family: 'Karla', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  h2, h3 { font-family: 'Bodoni Moda', Georgia, serif; font-weight: 500; margin: 0; color: var(--encre); }
  .mono { font-family: 'Space Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  p { margin: 0; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--laiton); outline-offset: 3px; }

  .wrap { max-width: 900px; margin: 0 auto; padding: 0 24px; }

  header.site {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--ivoire) 88%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
  }
  .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 24px; max-width: 900px; margin: 0 auto; }
  .brand { font-family: 'Bodoni Moda', serif; font-size: 1.05rem; font-style: italic; text-decoration: none; }
  .eyebrow { font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--laiton); }

  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 13px 26px; border-radius: 999px;
    font-weight: 600; font-size: 0.92rem; text-decoration: none; border: 1px solid transparent;
    cursor: pointer; transition: transform 0.15s ease, background 0.15s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: var(--bordeaux); color: var(--bordeaux-contrast); }
  .btn-primary:hover { background: color-mix(in srgb, var(--bordeaux) 85%, black); }
  .btn-ghost { background: transparent; color: var(--encre); border-color: var(--border); }
  .btn-ghost:hover { background: var(--ivoire-surface); }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
  .field label { font-size: 0.84rem; font-weight: 600; }
  .field input {
    font: inherit; font-size: 0.95rem; padding: 11px 12px; border-radius: 3px;
    border: 1px solid var(--border); background: var(--ivoire); color: var(--encre);
  }
  .field input:focus { outline: 2px solid var(--laiton); outline-offset: 1px; }
  .form-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px; align-items: center; }
  .account-sub { font-size: 0.88rem; color: var(--encre-soft); margin-bottom: 16px; }
  .account-empty { font-size: 0.9rem; color: var(--encre-soft); }
  .login-alert {
    margin-top: 14px; padding: 12px 14px; border-radius: 3px;
    background: color-mix(in srgb, var(--bordeaux) 12%, var(--ivoire-surface));
    border-left: 3px solid var(--bordeaux); color: var(--encre); font-size: 0.88rem;
  }

  .staff-card {
    max-width: 420px; margin: 64px auto 0; background: var(--ivoire-surface);
    border: 1px solid var(--border); border-radius: 4px; padding: 32px; box-shadow: var(--shadow);
  }

  .staff-header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 48px; }
  .staff-header h2 { font-style: italic; font-size: 1.8rem; }

  .stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 28px; }
  @media (max-width: 640px) { .stat-cards { grid-template-columns: 1fr 1fr; } }
  .stat-card {
    background: var(--ivoire-surface); border: 1px solid var(--border); border-radius: 4px;
    padding: 18px 14px; text-align: center;
  }
  .stat-num { font-family: 'Bodoni Moda', serif; font-style: italic; font-size: 1.7rem; color: var(--bordeaux); }
  .stat-label { font-size: 0.76rem; color: var(--encre-soft); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.04em; }

  .booking-list { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .booking-list-item {
    font-size: 0.92rem; padding: 12px 14px; background: var(--ivoire-surface);
    border-radius: 3px; border: 1px solid var(--border);
  }
  .booking-list-item .presta { color: var(--encre-soft); font-size: 0.85rem; display: block; margin-top: 2px; }

  /* ---------- calendrier de planning (même principe que le calendrier client/coiffeur) ---------- */
  .calendar-nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 24px; flex-wrap: wrap; }
  .calendar-nav .btn { padding: 9px 18px; font-size: 0.84rem; }
  .calendar-wrap { margin-top: 18px; overflow-x: auto; padding-bottom: 10px; }
  .calendar { display: grid; grid-auto-flow: column; grid-auto-columns: 138px; gap: 12px; width: max-content; }
  .cal-day { background: var(--ivoire); border: 1px solid var(--border); border-radius: 4px; padding: 14px; box-shadow: var(--shadow); }
  .cal-day-head { font-family: 'Space Mono', monospace; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--encre-soft); margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); text-align: center; line-height: 1.5; }
  .cal-day-head strong { display: block; font-size: 0.88rem; color: var(--encre); font-family: 'Karla', sans-serif; text-transform: none; letter-spacing: 0; }
  .cal-slots { display: flex; flex-direction: column; gap: 7px; }
  .cal-slot { border: 1px solid var(--border); border-radius: 3px; padding: 7px; font-size: 0.78rem; text-align: center; color: var(--encre-soft); font-family: 'Space Mono', monospace; line-height: 1.4; }
  .cal-slot.busy { background: var(--bordeaux); color: var(--bordeaux-contrast); border-color: var(--bordeaux); font-weight: 600; }
  .cal-slot.busy.no-show { background: transparent; color: var(--encre-soft); border-color: var(--bordeaux); text-decoration: line-through; opacity: 0.7; }
  .cal-slot.absent-slot { background: var(--ivoire-surface); color: var(--encre-soft); border-style: dashed; opacity: 0.7; }
  .cal-day.closed { opacity: 0.45; }
  .cal-day-closed-label { text-align: center; font-family: 'Space Mono', monospace; font-size: 0.78rem; color: var(--encre-soft); padding: 16px 0; }

  /* ---------- onglets + sélecteurs (Statistiques/Clients/Plannings, scope salon-entier/coiffeur) ---------- */
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip-btn {
    background: var(--ivoire-surface); border: 1px solid var(--border); color: var(--encre);
    border-radius: 999px; padding: 8px 18px; font-size: 0.84rem; font-weight: 600; cursor: pointer;
  }
  .chip-btn:hover { background: var(--ivoire); }
  .chip-btn.active { background: var(--bordeaux); color: var(--bordeaux-contrast); border-color: var(--bordeaux); }

  .client-table-wrap { margin-top: 16px; overflow-x: auto; }
  .client-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  .client-table th, .client-table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .client-table th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--encre-soft); font-weight: 600; }
  .client-table tbody tr:hover { background: var(--ivoire-surface); }

  /* ---------- onglet "Vue mensuelle" (qui a travaillé quel jour) ---------- */
  .month-table-wrap { margin-top: 16px; overflow-x: auto; }
  .month-table { border-collapse: collapse; font-size: 0.78rem; font-family: 'Space Mono', monospace; }
  .month-table th, .month-table td { border: 1px solid var(--border); padding: 6px 8px; text-align: center; min-width: 28px; }
  .month-table thead th { background: var(--ivoire-surface); font-weight: 600; }
  .month-table th:first-child, .month-table td:first-child {
    text-align: left; font-family: 'Karla', sans-serif; font-weight: 600; white-space: nowrap;
    min-width: 90px; position: sticky; left: 0; background: var(--ivoire);
  }
  .month-cell-closed { color: var(--encre-soft); opacity: 0.35; }
  .month-cell-off { color: var(--encre-soft); background: var(--ivoire-surface); }
  .month-cell-absent { color: var(--bordeaux); font-weight: 700; }
  .month-cell-work { color: var(--encre); font-weight: 600; }
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">

<header class="site">
  <div class="header-inner">
    <a class="brand" href="salon-odette-espace-coiffeur.html">← Espace coiffeur</a>
    <span class="eyebrow">Espace propriétaire</span>
  </div>
</header>

<main class="wrap" style="padding-bottom: 80px;">
  <div id="loginPanel" class="staff-card"></div>
  <div id="dashboardPanel" hidden></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js"></script>
